# Aster HSA: one command to run everything locally.
#   docker compose up --build
# Web app: http://localhost:3000   API docs: http://localhost:8000/api/docs
# In the event of live deployment easiest course of action is to adjust compose.yaml
# Values below can be overridden with a .env file (see .env.example).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aster_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aster}
    volumes:
      # Named volume: data survives `docker compose down` / restarts.
      # Only `docker compose down -v` deletes it.
      - aster_pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      # Exposed on 5433 so it does not clash with a Postgres already on 5432.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aster} -d ${POSTGRES_DB:-aster}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aster}:${POSTGRES_PASSWORD:-aster_local_dev}@db:5432/${POSTGRES_DB:-aster}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aster}:${POSTGRES_PASSWORD:-aster_local_dev}@db:5432/aster_test
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  aster_pgdata:
